name: EURUSD signals

on:
  schedule:
    # 3 minutes after every hour (UTC), Sunday to Friday - the forex week. GitHub may start a few minutes late.
    - cron: "3 * * * 0-5"
  workflow_dispatch: {}          # "Run workflow" button for a manual check

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cloud.txt
      - run: pip install -r requirements-cloud.txt
      - run: python -W ignore cloud_job.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER || vars.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD || vars.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO || vars.ALERT_EMAIL_TO }}
          ALERT_LOT: ${{ secrets.ALERT_LOT || vars.ALERT_LOT }}
          FTP_HOST: ${{ secrets.FTP_HOST || vars.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER || vars.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
          PAGE_NAME: ${{ secrets.PAGE_NAME || vars.PAGE_NAME }}
